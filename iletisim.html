<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!--framework denetimi için vue.js-->

</head>

<body class="bg-white p-5">
    <div id="app" class="form karti">
        <h3 class="text-center">İletişim Formu</h3>
        <form id="iletişim_form" action="gonder.php" method="POST">
            <div class="mb-3">
                <label for="adi">Adınız:</label>
                <input type="text" id="adi" name="adi" placeholder="Adınızı Giriniz" class="form-kontrol" required>
            </div>
            <div class="mb-3">
                <label for="soyadi">Soyadınız:</label>
                <input type="text" id="soyadi" name="soyadi" placeholder="Soyadınızı Giriniz" class="form-kontrol">
            </div>
            <div class="mb-3">
                <label for="e-mail">E-mail:</label>
                <input type="text" id="e-mail" name="e-mail" placeholder="E-mail Giriniz" class="form-kontrol">
            </div>
            <div class="mb-3">
                <label for="telefon">Telefon:</label>
                <input type="text" id="telefon" name="telefon" pattern="" [0-9]{10,11}
                    placeholder="Telefon Numaranızı Giriniz" class="form-kontrol">
            </div>
            <label>Şehir:</label>
            <select name="sehir" class="form-select">
                <option value="Kocaeli">Kocaeli</option>
                <option value="Sakarya">Sakarya</option>
                <option value="İstanbul">İstanbul</option>
            </select>
            <div class="cinsiyet mb-3">
                <label>Cinsiyet:</label>
                <input type="radio" name="cinsiyet" value="erkek">Erkek
                <input type="radio" name="cinsiyet" value="kadin">Kadın

            </div>
            <div class="mb-3">
                <label for="mesaj" class="form-label d-block">Mesajınız:</label>
                <textarea name="mesaj" rows="3" class="form-kontrol"></textarea>
            </div>
            <div class="text-center d-grid gap-2 col-12 mt-4">
                <input type="button" class="javascript-buton" value="js ile denetle" onclick="validateJs()">
                <input type="button" class="vue-buton" value="vue.js ile denetle" @click="validateVue">
                <input type="reset" class="temizle" value="Temizle">
                <input type="submit" class="gonder" value="Gönder">

            </div>


        </form>
    </div>
    <script src="iletisim.js"></script>
</body>

</html>
