<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şehrim: Kocaeli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        
        .sehir-kart {
            border: 1px solid #ddd;
            margin: 10px;
            background-color: white;
            flex: 1;
        
        }

        .sehir-kart img {
            width: 100%;
            height: 600px;
            object-fit: contain;
        }

        /* Slider'ın yan yana durması için Bootstrap d-flex kullanımı */
        .carousel-item {
            display: none;
            /* Varsayılan */
        }

        .carousel-item.active {
            display: flex;
            /* Aktifken kartları yan yana diz */
            justify-content: center;
        }

        /* Okların belirgin olması için */
        .carousel-control-prev-icon,
        .carousel-control-next-icon {
            background-color: #333;
            border-radius: 50%;
        }
    </style>
</head>

<body class="sehir">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="tasarım.html">Saniye Topal</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="tasarım.html">Hakkında</a></li>
                    <li class="nav-item"><a class="nav-link" href="cv.html">Özgeçmiş</a></li>
                    <li class="nav-item active"><a class="nav-link" href="sehir.html">Şehrim</a></li>
                    <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="text-center mb-5">Kocaeli</h1>

       <div id="kocaeli" class="carousel slide">
    <div class="carousel-inner">

        <div class="carousel-item active">
            <div class="sehir-kart">
                <img src="img/masukiye-selale.jpg" alt="Maşukiye">
                <div class="p-3 text-center"><h5>Maşukiye</h5></div>
            </div>
        </div>

        <div class="carousel-item">
            <div class="sehir-kart">
                <img src="img/esme.jpg" alt="Eşme">
                <div class="p-3 text-center"><h5>Eşme</h5></div>
            </div>
        </div>

        <div class="carousel-item">
            <div class="sehir-kart">
                <img src="img/ormanya.jpg" alt="Ormanya">
                <div class="p-3 text-center"><h5>Ormanya</h5></div>
            </div>
        </div>

        <div class="carousel-item">
            <div class="sehir-kart">
                <img src="img/Kefken-Pembe-Kayalar.jpg" alt="Kandıra">
                <div class="p-3 text-center"><h5>Pembe Kayalar</h5></div>
            </div>
        </div>

        <div class="carousel-item">
            <div class="sehir-kart">
                <img src="img/sekaimg.jpg" alt="Seka">
                <div class="p-3 text-center"><h5>Seka</h5></div>
            </div>
        </div>

    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#kocaeli" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#kocaeli" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

        <div class="row mt-5 p-4 bg-white rounded">
            <div class="col-md-12">
                <h3>Kocaeli Hakkında</h3>
                <p>Nüfus: 2.192.388</p>
                <p>Kocaeli, Türkiye'nin Marmara bölgesinde yer alan illerimizdendir. Kocaeli gelişmiş sanayi şehri olarak bilinse de eşsiz doğal güzelliklere sahiptir.

                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
